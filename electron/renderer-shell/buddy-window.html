<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Claude Buddy</title>
    <style>
      /*
       * Hardware Buddy shell — residual from app.asar
       *   .vite/renderer/buddy_window/buddy.html
       *   assets/main-BQ4c6Ic9.css
       *   assets/BuddyWindow-X4XRY9Jd.js (ce root)
       * Full React/tailwind dump is not re-vendored; residual buddy tokens + layout only.
       */
      :root {
        --cream: #f4f3ee;
        --clay: #d97757;
        --clay-hover: #c86848;
        --ink: #2d2d2d;
        --ink-dim: #6b6862;
        --line: rgba(45, 45, 45, 0.1);
        --ok: #2d7a3e;
        --err: #b33a3a;
        --bg-000: 0 0% 100%;
        --bg-300: 48 25% 92.2%;
        --bg-400: 50 20.7% 88.6%;
        --text-000: 60 2.6% 7.6%;
        --text-100: 60 2.6% 7.6%;
        --text-300: 60 2.5% 23.3%;
        --border-300: 30 3.3% 11.8%;
        --brand-000: 15 54.2% 51.2%;
        --brand-200: 15 63.1% 59.6%;
        --oncolor-100: 0 0% 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        -webkit-font-smoothing: antialiased;
        font-family:
          "Anthropic Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .nc-drag {
        -webkit-app-region: drag;
        app-region: drag;
      }
      .nc-no-drag {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }

      .buddy-body {
        background: var(--cream);
        color: var(--ink);
      }
      .buddy-stick {
        width: 115px;
        height: 245px;
        padding: 15px 19px 0;
        background: linear-gradient(145deg, #f47b3e, #e8652a);
        border-radius: 16px;
        box-shadow:
          0 6px 20px #e8652a38,
          0 2px 4px #0000001f,
          inset 0 1px #fff3;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .buddy-stick-screen {
        width: 77px;
        height: 134px;
        background: #000;
        border-radius: 2px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 2px #00000080;
        flex-shrink: 0;
      }
      .buddy-stick-screen img {
        width: 77px;
        image-rendering: pixelated;
      }
      .buddy-stick-btn {
        width: 62px;
        height: 52px;
        background: linear-gradient(180deg, #d85a24, #c04818);
        border-radius: 7px;
        box-shadow:
          inset 0 -2px 3px #0000004d,
          inset 0 1px #ffffff26,
          0 1px #0000001a;
      }
      .buddy-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .buddy-dashed {
        border-style: dashed;
      }
      .buddy-drop-over {
        border-color: var(--clay);
        border-style: solid;
        background: #d977570f;
      }
      .buddy-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #bbb;
        display: inline-block;
      }
      .buddy-dot.on {
        background: #4a90d9;
      }
      .buddy-bar {
        height: 4px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .buddy-bar.active {
        opacity: 1;
      }
      .buddy-bar > div {
        height: 100%;
        background: var(--clay);
        transition: width 0.15s ease-out;
      }
      .buddy-overlay {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: var(--cream);
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      .buddy-overlay pre {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        overflow-x: auto;
        margin: 6px 0;
      }
      .buddy-overlay a {
        color: var(--clay);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .buddy-overlay a:hover {
        color: var(--clay-hover);
      }
      .buddy-overlay code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        background: #0000000d;
        padding: 1px 4px;
        border-radius: 3px;
      }

      /* residual Button flat/ghost/sm/lg/icon subset used by BuddyWindow */
      .buddy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
        user-select: none;
        cursor: pointer;
        border: none;
        font-family: inherit;
        font-weight: 500;
        background: transparent;
      }
      .buddy-btn:disabled {
        pointer-events: none;
        opacity: 0.5;
      }
      .buddy-btn-flat {
        background: hsl(var(--brand-000));
        color: hsl(var(--oncolor-100));
        transition: colors 0.15s;
      }
      .buddy-btn-flat:hover {
        background: hsl(var(--brand-200));
      }
      .buddy-btn-ghost {
        color: hsl(var(--text-300));
        border: 1px solid transparent;
        transition: background 0.3s;
      }
      .buddy-btn-ghost:hover {
        background: hsl(var(--bg-400));
        color: hsl(var(--text-100));
      }
      .buddy-btn-sm {
        height: 2rem;
        border-radius: 0.375rem;
        padding: 0 0.75rem;
        font-size: 0.75rem;
        min-width: 4rem;
      }
      .buddy-btn-lg {
        height: 2.75rem;
        border-radius: 0.6rem;
        padding: 0 1.25rem;
        min-width: 6rem;
        white-space: nowrap;
        font-size: 0.875rem;
      }
      .buddy-btn-icon {
        height: 2.25rem;
        width: 2.25rem;
        border-radius: 0.375rem;
        padding: 0;
        min-width: 0;
      }

      .h-screen {
        height: 100vh;
      }
      .flex {
        display: flex;
      }
      .flex-1 {
        flex: 1 1 0%;
      }
      .flex-col {
        flex-direction: column;
      }
      .items-center {
        align-items: center;
      }
      .items-stretch {
        align-items: stretch;
      }
      .justify-center {
        justify-content: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .gap-1 {
        gap: 0.25rem;
      }
      .gap-1\.5 {
        gap: 0.375rem;
      }
      .gap-2 {
        gap: 0.5rem;
      }
      .gap-4 {
        gap: 1rem;
      }
      .gap-5 {
        gap: 1.25rem;
      }
      .min-h-0 {
        min-height: 0;
      }
      .min-w-0 {
        min-width: 0;
      }
      .overflow-hidden {
        overflow: hidden;
      }
      .overflow-y-auto {
        overflow-y: auto;
      }
      .shrink-0 {
        flex-shrink: 0;
      }
      .select-none {
        user-select: none;
      }
      .select-text {
        user-select: text;
      }
      .text-center {
        text-align: center;
      }
      .text-left {
        text-align: left;

      .text-right {

      .font-sans {

      .font-mono {

      }
      .font-bold {
        font-weight: 700;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      .whitespace-pre {
        white-space: pre;
      }
      .whitespace-pre-wrap {
        white-space: pre-wrap;
      }
      .break-all {
        word-break: break-all;
      }
      .cursor-pointer {
        cursor: pointer;
      }
      .border {
        border-width: 1px;
        border-style: solid;
      }
      .border-b {
        border-bottom-width: 1px;
        border-bottom-style: solid;
      }
      .rounded {
        border-radius: 0.25rem;
      }
      .opacity-40 {
        opacity: 0.4;
      }
      .ml-auto {
        margin-left: auto;
      }
      .mt-1 {
        margin-top: 0.25rem;
      }
      .mt-2 {
        margin-top: 0.5rem;
      }
      .mt-2\.5 {
        margin-top: 0.625rem;
      }
      .mt-3 {
        margin-top: 0.75rem;
      }
      .mt-4 {
        margin-top: 1rem;
      }
      .mb-0\.5 {
        margin-bottom: 0.125rem;
      }
      .mb-1 {
        margin-bottom: 0.25rem;
      }
      .mb-2 {

      }
      .mb-3 {

      .px-2 {

      .px-3 {

      .px-4 {

      .py-1\.5 {
        padding-top: 0.375rem;

      .tracking-wider {

      .tracking-\[0\.02em\] {

      }
      .tracking-\[0\.4em\] {
        letter-spacing: 0.4em;
      }
      .min-h-\[14px\] {
        min-height: 14px;
      }
      .transition-colors {
        transition: color 0.15s, background-color 0.15s, border-color 0.15s;
      }
      .hidden {
        display: none !important;
      }
      input:focus {
        outline: none;
        border-color: var(--clay) !important;
      }
      .hover-border-clay:hover {
        border-color: var(--clay) !important;
      }
    </style>

  <body>
    <div id="root"></div>
