<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Claude Quick Entry</title>
    <style>
      /*
       * Quick Entry shell — residual DOM/classNames from app.asar
       *   .vite/renderer/quick_window/quick-window.html
       *   assets/main-oBdKGVdT.js (load handlers)
       * Tokens from residual window-shared.css / about.html :root (claude.ai 2025-10-17).
       * Full tailwind dump is not re-vendored; only rules Quick uses.
       */
      :root {
        --claude-accent-clay: #d97757;
        --claude-foreground-color: black;
        --claude-background-color: #faf9f5;
        --claude-secondary-color: #737163;
        --claude-border: #706b5740;
        --claude-text-100: #29261b;
        --claude-text-200: #3d3929;
        --claude-text-400: #656358;
        --claude-text-500: #a6a39b;
        --claude-description-text: #535146;
        --text-400: 51 3.1% 43.7%;
        --text-500: 51 3.1% 43.7%;
      }

      .darkTheme {
        --claude-foreground-color: white;
        --claude-background-color: #262624;
        --claude-secondary-color: #a6a39a;
        --claude-border: #eaddd81a;
        --claude-text-100: #f5f4ef;
        --claude-text-200: #e5e5e2;
        --claude-text-400: #b8b5a9;
        --claude-text-500: #a6a39b;
        --claude-description-text: #ceccc5;
        --text-400: 48 4.8% 59.2%;
        --text-500: 48 4.8% 59.2%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        color: var(--claude-foreground-color);
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-family:
          "Anthropic Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      /* residual: transparent so outside-click / panel chrome work */
      body {
        background-color: transparent;
        overflow: hidden;
        /* We do this so that we can click outside of the window to close it */
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }

      .container {
        -webkit-app-region: drag;
        app-region: drag;
        border-radius: 16px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        font-family:
          "Anthropic Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        position: relative;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 1),
          rgba(245, 245, 250, 0.95)
        );
        width: 100%;
        max-width: none;
      }

      .darkTheme .container {
        background: linear-gradient(
          to bottom,
          rgba(64, 63, 62, 0.95),
          rgba(41, 37, 35, 1)
        );
      }

      /*
       * The border gets clipped a bit by its container unless we set its radius
       * to be 1px more than its container's.
       */
      .container:before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 17px;
        pointer-events: none;
        border: 0.5px solid rgba(0, 0, 0, 0.2);
      }

      .darkTheme .container:before {
        border: 0.5px solid rgba(255, 255, 255, 0.2);
      }

      app-logo {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      app-logo svg {
        display: block;
      }

      .input-box {
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
        min-height: 56px;
      }

      .input-box textarea {
        -webkit-app-region: no-drag;
        app-region: no-drag;
        background-color: transparent;
        background: transparent;
        border: none;
        box-sizing: border-box;
        color: var(--claude-foreground-color);
        display: block;
        flex: 1 1 auto;
        font-family:
          "Anthropic Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 16px;
        font-style: normal;
        font-weight: 400;
        height: 40px;
        line-height: 150%; /* 24px */
        margin-left: -8px;
        margin-right: 22px;
        min-height: 24px;
        outline: none;
        overflow-y: hidden;
        padding: 8px;
        resize: none;
        width: 100%;
        appearance: none;
        box-shadow: none;
      }

      .input-box textarea::placeholder {
        color: var(--claude-text-500);
        opacity: 1;
      }

      .darkTheme .input-box textarea::placeholder {
        color: var(--claude-text-500);
      }

      .input-box textarea:focus {
        outline: none;
        border-radius: 16px;
        box-shadow: none;
        border-color: transparent;
      }

      #prompt-input {
        box-shadow: none;
      }
    </style>
  </head>
  <!-- residual body: id=body class=light transparent; container > app-logo + input-box > #prompt-input -->
  <body id="body" class="light" style="background-color: transparent">
    <div class="container">
      <app-logo width="18" height="18"></app-logo>
      <div class="input-box">
        <textarea
          id="prompt-input"
          placeholder="What can I help you with today?"
          maxlength="16384"
        ></textarea>
      </div>
    </div>
    <script defer src="./quick-window.js"></script>
  </body>
</html>
